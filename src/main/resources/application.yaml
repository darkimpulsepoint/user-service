spring:
  application:
    name: user-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    web:
      pageable:
        max-page-size: 100
  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL:10m}
      key-prefix: "user-service::"
      use-key-prefix: true
      cache-null-values: false
server:
  port: ${SERVER_PORT:8080}
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:auth-service}
